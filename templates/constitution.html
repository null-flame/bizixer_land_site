<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قانون اساسی | Bizixer Land</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #050510;
            background-image:
                radial-gradient(circle at 20% 10%, rgba(0,243,255,.12), transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(184,0,255,.12), transparent 40%);
            color: #e5e7eb;
            min-height: 100vh;
        }
        .neon {
            background: linear-gradient(90deg,#00f3ff,#b800ff,#00f3ff);
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px rgba(0,243,255,.35);
        }
        .card {
            background: rgba(10,10,25,.65);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0,243,255,.25);
            box-shadow: 0 0 25px rgba(0,243,255,.08);
            border-radius: 20px;
        }
        .btn {
            transition: all .3s;
            border: 1px solid rgba(0,243,255,.4);
            background: rgba(0,243,255,.05);
            color: #67e8f9;
        }
        .btn:hover { background: rgba(0,243,255,.15); box-shadow: 0 0 18px rgba(0,243,255,.4); }
        .btn-purple { border-color: rgba(184,0,255,.4); background: rgba(184,0,255,.05); color: #d8b4fe; }
        .btn-purple:hover { background: rgba(184,0,255,.15); box-shadow: 0 0 18px rgba(184,0,255,.4); }

        .prose { line-height: 2; color: #d1d5db; font-size: 1rem; }
        .prose h1 { font-size: 2.1rem; font-weight: 800; color: #00f3ff; margin: 2rem 0 1rem; padding-bottom: .5rem; border-bottom: 2px solid rgba(0,243,255,.2); }
        .prose h2 { font-size: 1.5rem; font-weight: 700; color: #b800ff; margin: 2rem 0 .8rem; padding-right: .75rem; padding-bottom: .25rem; border-right: 4px solid #b800ff; scroll-margin-top: 90px; }
        .prose h3 { font-size: 1.15rem; font-weight: 700; color: #67e8f9; margin: 1.5rem 0 .5rem; }
        .prose p  { margin: .9rem 0; }
        .prose strong { color: #a5f3fc; font-weight: 700; }
        .prose ul, .prose ol { margin: .75rem 0; padding-right: 1.75rem; }
        .prose li { margin: .35rem 0; }
        .prose ul li::marker { color: #00f3ff; }
        .prose ol li::marker { color: #b800ff; }
        .prose hr { border: none; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,243,255,.4), transparent); margin: 2rem 0; }
        .prose table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; background: rgba(0,0,0,.3); border-radius: 12px; overflow: hidden; }
        .prose th, .prose td { padding: .7rem 1rem; border-bottom: 1px solid rgba(0,243,255,.15); text-align: right; }
        .prose th { background: rgba(0,243,255,.08); color: #67e8f9; font-weight: 700; }
        .prose tr:last-child td { border-bottom: none; }
        .prose code { background: rgba(0,243,255,.1); color: #67e8f9; padding: .1rem .4rem; border-radius: 6px; font-size: .9em; }
        .prose blockquote { border-right: 4px solid #b800ff; background: rgba(184,0,255,.05); padding: .5rem 1rem; margin: 1rem 0; border-radius: 8px; color: #d8b4fe; }

        .toc-item { display: block; padding: .4rem .6rem; border-radius: 8px; color: #9ca3af; font-size: .8rem; transition: all .2s; border-right: 2px solid transparent; }
        .toc-item:hover { background: rgba(0,243,255,.08); color: #67e8f9; border-right-color: #00f3ff; }
        .toc-item.active { background: rgba(0,243,255,.12); color: #67e8f9; border-right-color: #00f3ff; }
    </style>
</head>
<body>
    <header class="sticky top-0 z-40 backdrop-blur-xl bg-black/60 border-b border-cyan-500/20">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <span class="neon text-2xl font-extrabold">BIZIXER</span>
                <span class="neon text-sm font-bold">LAND</span>
            </a>
            <a href="/" class="btn px-3 py-1.5 rounded-lg text-xs font-bold inline-flex items-center gap-1">
                <i class="fa-solid fa-house"></i> خانه
            </a>
        </div>
    </header>

    <section class="max-w-5xl mx-auto px-4 pt-10 pb-4 text-center">
        <div class="inline-block px-3 py-1 rounded-full border border-purple-500/50 bg-purple-500/10 text-purple-300 text-xs mb-3">
            <i class="fa-solid fa-scroll ml-1"></i> سند رسمی
        </div>
        <h1 class="neon text-3xl md:text-4xl font-extrabold mb-2">قانون اساسی بیزیکسر لند</h1>
        <p class="text-gray-400 text-sm">متن کامل و رسمی قانون اساسی</p>
    </section>

    <div class="max-w-7xl mx-auto px-4 pb-16 grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-6">
        <aside class="card p-4 h-fit lg:sticky lg:top-20">
            <h3 class="text-cyan-300 font-bold text-sm mb-2 flex items-center gap-1">
                <i class="fa-solid fa-list"></i> فهرست
            </h3>
            <nav id="toc" class="space-y-0.5"></nav>
        </aside>

        <main class="card p-6 md:p-10">
            <article id="content" class="prose">
                <p class="text-gray-500">در حال بارگذاری...</p>
            </article>

            <hr class="my-8 border-cyan-500/20">

            <div class="p-4 rounded-xl border border-yellow-500/40 bg-yellow-500/10 text-center">
                <label class="flex items-center justify-center gap-3 cursor-pointer">
                    <input type="checkbox" id="accept" class="w-5 h-5 accent-cyan-400 cursor-pointer">
                    <span class="text-yellow-200 font-bold text-sm">قانون اساسی را خوانده‌ام و قبول دارم</span>
                </label>
                <p class="text-xs text-yellow-300/70 mt-2">با پذیرش، لینک‌های صفحه اصلی باز می‌شوند.</p>
            </div>

            <div class="mt-6 text-center">
                <a href="/" class="btn-purple btn inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold">
                    <i class="fa-solid fa-arrow-right"></i> بازگشت به خانه
                </a>
            </div>
        </main>
    </div>

    <script>
        marked.setOptions({ breaks: true, gfm: true });

        const KEY = 'bizixer_law_accepted';
        const accept = document.getElementById('accept');
        accept.checked = localStorage.getItem(KEY) === '1';
        accept.addEventListener('change', () => {
            localStorage.setItem(KEY, accept.checked ? '1' : '0');
        });

        (async () => {
            const content = document.getElementById('content');
            const toc = document.getElementById('toc');
            try {
                const res = await fetch('/api/constitution');
                if (!res.ok) throw new Error('خطا در دریافت');
                const { content: md } = await res.json();
                content.innerHTML = marked.parse(md);

                const headings = content.querySelectorAll('h2');
                headings.forEach((h, i) => {
                    if (!h.id) h.id = 'sec-' + i;
                    const a = document.createElement('a');
                    a.href = '#' + h.id;
                    a.className = 'toc-item';
                    a.textContent = h.textContent;
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        document.getElementById(h.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                    toc.appendChild(a);
                });

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            document.querySelectorAll('.toc-item').forEach((el) => {
                                el.classList.toggle('active', el.getAttribute('href') === '#' + entry.target.id);
                            });
                        }
                    });
                }, { rootMargin: '-80px 0px -70% 0px' });
                headings.forEach((h) => observer.observe(h));
            } catch (err) {
                content.innerHTML = '<p class="text-red-400">خطا در بارگذاری: ' + err.message + '</p>';
            }
        })();
    </script>
</body>
</html>
