<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizixer Land</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #050510;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(0,243,255,.15), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(184,0,255,.15), transparent 50%);
            color: #fff;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .panel {
            background: rgba(10,10,25,.65);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0,243,255,.3);
            box-shadow: 0 0 25px rgba(0,243,255,.1);
            border-radius: 20px;
        }
        .neon {
            font-family: 'Arial Black', Impact, sans-serif;
            background: linear-gradient(90deg,#00f3ff,#b800ff,#00f3ff);
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(0,243,255,.4);
            letter-spacing: 2px;
        }
        .btn {
            transition: all .3s;
            border: 1px solid rgba(0,243,255,.4);
            background: rgba(0,243,255,.05);
        }
        .btn:hover { background: rgba(0,243,255,.15); box-shadow: 0 0 18px rgba(0,243,255,.4); transform: translateY(-2px); }
        .btn-purple { border-color: rgba(184,0,255,.4); background: rgba(184,0,255,.05); }
        .btn-purple:hover { background: rgba(184,0,255,.15); box-shadow: 0 0 18px rgba(184,0,255,.4); }
        .locked a { pointer-events: none; opacity: .5; }
        .locked .cid { filter: blur(5px); user-select: none; }
        .md-preview { max-height: 220px; overflow: hidden; position: relative; }
        .md-preview::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
            background: linear-gradient(to top, rgba(10,10,25,.95), transparent);
        }
        .md h1 { font-size: 1.5rem; color: #00f3ff; margin: 1rem 0 .6rem; }
        .md h2 { font-size: 1.2rem; color: #b800ff; margin: 1rem 0 .5rem; }
        .md h3 { font-size: 1rem; color: #67e8f9; margin: .8rem 0 .4rem; }
        .md p  { margin: .4rem 0; line-height: 1.85; color: #d1d5db; font-size: .875rem; }
        .md strong { color: #a5f3fc; }
        .md ul, .md ol { padding-right: 1.25rem; margin: .4rem 0; }
        .md li { margin: .2rem 0; color: #d1d5db; font-size: .875rem; }
        .md hr { border-color: rgba(0,243,255,.15); margin: 1rem 0; }
    </style>
</head>
<body>
    <div class="panel max-w-2xl mx-auto p-6 md:p-8 text-center">
        <h1 class="neon text-4xl font-extrabold uppercase">Bizixer</h1>
        <h2 class="neon text-2xl font-bold uppercase mt-1">Land</h2>

        <div class="mt-3 mb-5 inline-block px-3 py-1 rounded-full border border-purple-500/50 bg-purple-500/10 text-purple-300 text-xs">
            <i class="fa-solid fa-code ml-1"></i> سازنده: Hamid.vexor
        </div>

        <section class="text-right mb-5">
            <h3 class="text-lg font-bold text-cyan-300 mb-2 flex items-center gap-2">
                <i class="fa-solid fa-scroll"></i> قانون اساسی بیزیکسر لند
            </h3>
            <div class="bg-black/40 border border-cyan-500/30 rounded-xl p-4">
                <div id="preview" class="md md-preview">
                    <p class="text-gray-500 text-sm">در حال بارگذاری...</p>
                </div>
            </div>
            <a href="/constitution"
               class="btn btn-purple inline-flex items-center gap-2 mt-3 px-4 py-2 rounded-xl text-purple-300 text-sm font-bold">
                <i class="fa-solid fa-book-open"></i>
                مشاهده متن کامل قانون اساسی
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </section>

        <div class="mb-5 p-3 rounded-xl border border-yellow-500/40 bg-yellow-500/10">
            <label class="flex items-center justify-center gap-3 cursor-pointer select-none">
                <input type="checkbox" id="accept" class="w-5 h-5 accent-cyan-400 cursor-pointer">
                <span class="text-yellow-200 font-bold text-sm">قانون اساسی را خوانده‌ام و قبول دارم</span>
            </label>
            <p class="text-xs text-yellow-300/70 mt-1">تا زمانی که تیک نزنید، لینک‌ها و آی‌دی کانال قفل هستند.</p>
        </div>

        <div id="links" class="space-y-3 locked">
            <a href="{{ channel_url }}" target="_blank" rel="noopener"
               class="btn flex items-center justify-between px-5 py-3 rounded-xl text-cyan-300">
                <div class="flex items-center gap-3">
                    <i class="fa-brands fa-telegram text-xl text-cyan-400"></i>
                    <div class="text-right">
                        <div class="font-bold text-sm">کانال عمومی روبیکا</div>
                        <div class="text-xs text-cyan-200/70 cid" dir="ltr">{{ channel_id }}</div>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <a href="{{ join_url }}" target="_blank" rel="noopener"
               class="btn btn-purple flex items-center justify-between px-5 py-3 rounded-xl text-purple-300">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-users text-xl text-purple-400"></i>
                    <div class="text-right">
                        <div class="font-bold text-sm">ورود به کمپانی</div>
                        <div class="text-xs text-purple-200/70">گروه رسمی روبیکا</div>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <p class="text-right text-xs text-red-400 mr-2 flex items-center gap-1">
                <i class="fa-solid fa-triangle-exclamation"></i> لینک ورود ممکن است منقضی شده باشد.
            </p>
        </div>

        <div class="mt-6 text-xs text-gray-500">&copy; {{ year }} Bizixer Land</div>
    </div>

    <script>
        marked.setOptions({ breaks: true, gfm: true });

        const KEY = 'bizixer_law_accepted';
        const accept = document.getElementById('accept');
        const links = document.getElementById('links');

        function applyLock() {
            links.classList.toggle('locked', !accept.checked);
        }
        accept.checked = localStorage.getItem(KEY) === '1';
        applyLock();
        accept.addEventListener('change', () => {
            localStorage.setItem(KEY, accept.checked ? '1' : '0');
            applyLock();
        });
        links.addEventListener('click', (e) => {
            if (links.classList.contains('locked')) {
                e.preventDefault(); e.stopPropagation();
                alert('ابتدا قانون اساسی را بخوانید و تیک پذیرش را بزنید.');
            }
        });

        (async () => {
            const el = document.getElementById('preview');
            try {
                const res = await fetch('/api/constitution');
                if (!res.ok) throw new Error('خطا در دریافت');
                const { content } = await res.json();
                const slice = content.substring(0, 1400);
                const cut = slice.lastIndexOf('\n');
                el.innerHTML = marked.parse(slice.substring(0, cut));
            } catch (err) {
                el.innerHTML = '<p class="text-red-400 text-sm">خطا: ' + err.message + '</p>';
            }
        })();
    </script>
</body>
</html>
